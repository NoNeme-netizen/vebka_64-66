://dequeuniversity.com/rules/axe/4.13/definition-list)…","score":null,"scoreDisplayMode":"notApplicable"},"dlitem":{"id":"dlitem","title":"Элементы списков определений расположены внутри элементов `\u003cdl>`","description":"Чтобы программы чтения с экрана правильно озвучивали элементы списков определений `\u003cdt>` и `\u003cdd>`, они должны располагаться внутри родительского элемента `\u003cdl>`. Подробнее о том, [как правильно создавать списки определений](https://dequeuniversity.com/rules/axe/4.13/dlitem)…","score":null,"scoreDisplayMode":"notApplicable"},"document-title":{"id":"document-title","title":"Документ содержит элемент `\u003ctitle>`","description":"Название (элемент title) нужно для того, чтобы программы чтения с экрана могли озвучивать название страницы. Также оно появляется в результатах поиска и позволяет определять, соответствует ли сайт запросу. Подробнее [о названиях документов](https://dequeuniversity.com/rules/axe/4.13/document-title)…","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Неподходящие элементы"}],"items":[]}},"duplicate-id-aria":{"id":"duplicate-id-aria","title":"Идентификаторы ARIA уникальны","description":"Значение идентификатора ARIA должно быть уникальным, поскольку технологии специальных возможностей могут игнорировать повторяющиеся идентификаторы. Подробнее о том, [как убрать копии идентификаторов ARIA](https://dequeuniversity.com/rules/axe/4.13/duplicate-id-aria)…","score":null,"scoreDisplayMode":"notApplicable"},"empty-heading":{"id":"empty-heading","title":"Во всех элементах заголовка есть содержимое","description":"Если у заголовка нет содержимого или текст недоступен, пользователи программы чтения с экрана не могут получить информацию о структуре страницы. Подробнее [о заголовках](https://dequeuniversity.com/rules/axe/4.13/empty-heading)…","score":null,"scoreDisplayMode":"notApplicable"},"form-
