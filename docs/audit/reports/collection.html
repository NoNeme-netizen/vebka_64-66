":"color-contrast","title":"Цвета фона и переднего плана достаточно контрастны","description":"Многие пользователи не видят текст с низкой контрастностью, или им сложно его воспринимать. Подробнее о том, [как обеспечить достаточный цветовой контраст](https://dequeuniversity.com/rules/axe/4.13/color-contrast)…","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Неподходящие элементы"}],"items":[]}},"definition-list":{"id":"definition-list","title":"Элементы `\u003cdl>` содержат только правильно размещенные группы `\u003cdt>` и `\u003cdd>` и элементы `\u003cscript>`, `\u003ctemplate>` или `\u003cdiv>`.","description":"Если списки определений размечены с ошибками, программы чтения с экрана могут озвучивать их некорректно. Подробнее о том, [как правильно создавать списки определений](https://dequeuniversity.com/rules/axe/4.13/definition-list)…","score":null,"scoreDisplayMode":"notApplicable"},"dlitem":{"id":"dlitem","title":"Элементы списков определений расположены внутри элементов `\u003cdl>`","description":"Чтобы программы чтения с экрана правильно озвучивали элементы списков определений `\u003cdt>` и `\u003cdd>`, они должны располагаться внутри родительского элемента `\u003cdl>`. Подробнее о том, [как правильно создавать списки определений](https://dequeuniversity.com/rules/axe/4.13/dlitem)…","score":null,"scoreDisplayMode":"notApplicable"},"document-title":{"id":"document-title","title":"Документ содержит элемент `\u003ctitle>`","description":"Название (элемент title) нужно для того, чтобы программы чтения с экрана могли озвучивать название страницы. Также оно появляется в результатах поиска и позволяет определять, соответствует ли сайт запросу. Подробнее [о названиях документов](https://dequeuniversity.com/rules/axe/4.13/document-title)…","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"n
