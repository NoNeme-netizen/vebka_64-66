# nginx — обратный прокси и единая точка входа «Манчкин-пикера».
# Снаружи открыт только nginx (80/443); приложение доступно ему
# по внутреннему имени сервиса app:3000 (docker-compose сеть).

# HTTP -> HTTPS
server {
    listen 80;
    server_name munchkin-picker.localhost;
    return 301 https://$host$request_uri;
}

# HTTPS с локальным сертификатом (утилита mkcert)
server {
    listen 443 ssl;
    server_name munchkin-picker.localhost;

    # имена файлов должны совпадать с выпущенными mkcert
    ssl_certificate     /etc/nginx/certs/munchkin-picker.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/munchkin-picker.localhost-key.pem;

    # базовые защитные заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
